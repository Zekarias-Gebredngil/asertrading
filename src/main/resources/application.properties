server.port=8085
spring.application.name=asertrading
spring.datasource.url=jdbc:postgresql://localhost:5439/asertrading_db
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# HikariCP Connection Pool Optimization for High Concurrency
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# Multipart File Upload Boundaries
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000
app.currency=ETB
app.cors.allowed-origins=http://localhost:4200,http://localhost:3000,http://127.0.0.1:4200
app.storage.s3.enabled=${AWS_S3_ENABLED:false}
app.storage.s3.bucket=${AWS_S3_BUCKET:}
app.storage.s3.region=${AWS_REGION:us-east-1}
app.storage.s3.access-key=${AWS_ACCESS_KEY_ID:}
app.storage.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}
app.storage.s3.endpoint=${AWS_S3_ENDPOINT:}
app.storage.s3.public-url-prefix=${AWS_S3_PUBLIC_URL_PREFIX:}
app.storage.upload-dir=uploads
app.media.base-url=http://localhost:8085
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

