services:
  postgres:
    image: "postgres:latest"
    container_name: asertrading-postgres-1
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}"
  redis:
    image: "redis:latest"
    ports:
      - "${REDIS_PORT}"
